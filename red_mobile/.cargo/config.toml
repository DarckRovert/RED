# RED Mobile — Android Build Configuration
# Fuerza enlace estático de libc++ STL para que libred_mobile.so
# sea completamente autónomo (no requiere libc++_shared.so en el APK).

[target.aarch64-linux-android]
rustflags = [
    # Enlace estático de C++ STL — elimina la dependencia de libc++_shared.so
    "-C", "link-arg=-static-libstdc++",
    # Incluir libc++_static.a y libc++abi.a del NDK
    "-C", "link-arg=-lc++_static",
    "-C", "link-arg=-lc++abi",
    # Garantiza que libc++_shared NO se enlace dinámicamente
    "-C", "link-arg=-Wl,--exclude-libs,libc++_shared.so",
]
