[package]
name = "red_node"
version = "59.0.0"
edition = "2021"
authors = ["RED Team"]
description = "RED network node"
license = "AGPL-3.0"

[[bin]]
name = "red-node"
path = "src/main.rs"

[dependencies]
red-core = { path = "../core", package = "red_core" }
red-blockchain = { path = "../blockchain" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP REST API
axum = { version = "0.7", features = ["http1", "json", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
dirs = "5.0"

# Utilities
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Cryptography (for signing key)
ed25519-dalek = "2.0"

# Secure password input
rpassword = "7.0"

# Async stream for SSE
async-stream = "0.3"
futures = "0.3"
hex = "0.4"
http = "1.4.0"
base64 = "0.21"
image = "0.24"

# HTTP client para Guardian IA (Groq API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Errores tipados (amber.rs)
thiserror = "1.0"

# UUIDs para IDs de alertas AMBER
uuid = { version = "1.6", features = ["v4", "serde"] }

# Bases de datos y hashing
sled = "0.34"
blake3 = "1.5"

# Inteligencia Artificial Nativa GGUF (Pure Rust)
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.19.1"
data-encoding = "2.11.1"

