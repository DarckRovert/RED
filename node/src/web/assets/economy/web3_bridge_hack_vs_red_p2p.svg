<svg viewBox="0 0 720 350" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25090C" />
      <stop offset="100%" stop-color="#120406" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052417" />
      <stop offset="100%" stop-color="#03120C" />
    </linearGradient>
  </defs>

  <rect width="720" height="350" rx="12" fill="#070B12" stroke="rgba(255, 23, 68, 0.3)" stroke-width="1" />

  <!-- Header -->
  <rect x="0" y="0" width="720" height="42" fill="#0C1322" />
  <text x="20" y="26" fill="#FF5252" font-size="13" font-weight="800" letter-spacing="0.5" font-family="monospace">
    INMUNIDAD ARQUITECTÓNICA · HACKS DE PUENTES WEB3 ($570M) VS BÓVEDA P2P RED
  </text>

  <!-- Panel Superior: El Colapso de los Puentes Web3 -->
  <g transform="translate(16, 54)">
    <rect width="688" height="126" rx="8" fill="url(#hackGrad)" stroke="rgba(255,23,68,0.25)" stroke-width="1" />
    
    <rect x="14" y="10" width="24" height="24" rx="6" fill="rgba(255,23,68,0.15)" />
    <text x="26" y="27" font-size="13" text-anchor="middle">💥</text>
    <text x="46" y="23" fill="#FF8A80" font-size="12" font-weight="800" font-family="sans-serif">
      Puentes Cross-Chain Web3 (Caso BNB Token Hub - $570M USD Robados en 2022)
    </text>

    <!-- Diagrama de Flujo del Ataque -->
    <g transform="translate(14, 40)">
      <!-- Nodo 1: Cadena A -->
      <rect x="0" y="0" width="130" height="54" rx="6" fill="#1C0608" stroke="#FF5252" stroke-width="1" />
      <text x="65" y="22" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Cadena Cosmos</text>
      <text x="65" y="38" fill="#FF8A80" font-size="9" text-anchor="middle" font-family="monospace">Hash de Bloque</text>

      <!-- Flecha a Puente -->
      <line x1="135" y1="27" x2="175" y2="27" stroke="#FF5252" stroke-width="2" stroke-dasharray="3,2" />
      <polygon points="175,27 167,23 167,31" fill="#FF5252" />

      <!-- Nodo 2: Smart Contract Puente (Vulnerabilidad) -->
      <rect x="180" y="0" width="180" height="54" rx="6" fill="#3D0B11" stroke="#FF1744" stroke-width="1.5" />
      <text x="270" y="20" fill="#FFD600" font-size="11" font-weight="800" text-anchor="middle" font-family="sans-serif">⚠️ Smart Contract Puente</text>
      <text x="270" y="36" fill="#FF5252" font-size="9" font-weight="700" text-anchor="middle" font-family="monospace">Falla en Verificación IAVL</text>

      <!-- Flecha de Ataque -->
      <line x1="365" y1="27" x2="405" y2="27" stroke="#FF1744" stroke-width="2" />
      <polygon points="405,27 397,23 397,31" fill="#FF1744" />

      <!-- Nodo 3: Falsificación & Drenaje -->
      <rect x="410" y="0" width="245" height="54" rx="6" fill="#200508" stroke="#FF1744" stroke-width="1" />
      <text x="532" y="20" fill="#FF1744" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">2M BNB ACUÑADOS DE LA NADA</text>
      <text x="532" y="36" fill="#FFA4A2" font-size="9" text-anchor="middle" font-family="sans-serif">Hacker drena fondos y Binance pausa la red</text>
    </g>

    <text x="20" y="114" fill="#FF8A80" font-size="10" font-family="sans-serif">
      • Causa Raíz: Dependencia de contratos intermedios centralizados con miles de líneas de código expuestas a internet.
    </text>
  </g>

  <!-- Panel Inferior: La Bóveda Táctica P2P de RED -->
  <g transform="translate(16, 192)">
    <rect width="688" height="142" rx="8" fill="url(#shieldGrad)" stroke="rgba(0,230,118,0.35)" stroke-width="1.5" />
    
