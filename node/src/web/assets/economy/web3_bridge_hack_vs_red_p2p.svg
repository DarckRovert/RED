    </text>

    <!-- Diagrama de Flujo Táctico -->
    <g transform="translate(14, 40)">
      <!-- Nodo 1: Bóveda Local -->
      <rect x="0" y="0" width="145" height="56" rx="6" fill="#041B11" stroke="#00E676" stroke-width="1" />
      <text x="72" y="22" fill="#FFF" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Bóveda del Operador</text>
      <text x="72" y="38" fill="#00E676" font-size="9" text-anchor="middle" font-family="monospace">Firma Ed25519 en Chip</text>

      <!-- Flecha Criptográfica -->
      <line x1="150" y1="28" x2="195" y2="28" stroke="#00E676" stroke-width="2" />
      <polygon points="195,28 187,24 187,32" fill="#00E676" />

      <!-- Nodo 2: Transporte QR / Radio -->
      <rect x="200" y="0" width="170" height="56" rx="6" fill="#042217" stroke="#00E5FF" stroke-width="1.5" />
      <text x="285" y="20" fill="#00E5FF" font-size="11" font-weight="800" text-anchor="middle" font-family="sans-serif">Canal Óptico / LoRa</text>
      <text x="285" y="36" fill="#7DD3FC" font-size="9" text-anchor="middle" font-family="monospace">Vale QR + Nullifier Único</text>

      <!-- Flecha a Receptor -->
      <line x1="375" y1="28" x2="420" y2="28" stroke="#00E676" stroke-width="2" />
      <polygon points="420,28 412,24 412,32" fill="#00E676" />

      <!-- Nodo 3: Validación Matemática -->
      <rect x="425" y="0" width="230" height="56" rx="6" fill="#03160D" stroke="#00E676" stroke-width="1" />
      <text x="540" y="20" fill="#00E676" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">VALIDACIÓN MATEMÁTICA PURA</text>
      <text x="540" y="36" fill="#A7F3D0" font-size="9" text-anchor="middle" font-family="sans-serif">Comerciante valida en modo avión (0ms lag)</text>
    </g>

    <text x="20" y="118" fill="#A7F3D0" font-size="10" font-family="sans-serif">
      • Inmunidad Absoluta: No existe ningún servidor central, contrato inteligente ni puente que hackear. Solo matemáticas puras entre dos dispositivos.
    </text>
    <text x="20" y="132" fill="#00E676" font-size="10" font-weight="700" font-family="monospace">
      ✓ INMUNE A HACKS EXTERNOS · OPERA SIN INTERNET NI PUENTES WEB3
    </text>
  </g>
</svg>
