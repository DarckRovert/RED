; PlatformIO Project Configuration File for RED Sovereign Mesh OS Repeater
; Standalone Autonomous Solar Repeater Firmware for Heltec LoRa 32 V3 & LilyGO T-Beam

[platformio]
default_envs = heltec_wifi_lora_32_v3
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/XPowersLib @ ^0.2.1
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D RED_REPEATER_VERSION=\"1.0.0\"
    -D RED_MESH_MAGIC=0x52454401

; ─── ENTORNO 1: Heltec WiFi LoRa 32 V3 (ESP32-S3 + Semtech SX1262) ───────────
[env:heltec_wifi_lora_32_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
board_build.mcu = esp32s3
board_build.f_cpu = 80000000L  ; Reducido a 80 MHz para ultra-bajo consumo
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3
    -D LORA_SCK=9
    -D LORA_MISO=11
    -D LORA_MOSI=10
    -D LORA_SS=8
    -D LORA_RST=12
    -D LORA_BUSY=13
    -D LORA_DIO1=14
    -D VEXT_PIN=36
    -D LED_PIN=35
    -D VBAT_ADC_PIN=1

; ─── ENTORNO 2: LilyGO T-Beam (ESP32 + Semtech SX1262 + GPS NEO-6M / AXP2101) ─
[env:lilygo_t_beam]
platform = espressif32
board = ttgo-t-beam
board_build.mcu = esp32
board_build.f_cpu = 80000000L
build_flags =
    ${env.build_flags}
    -D BOARD_T_BEAM
    -D LORA_SCK=5
    -D LORA_MISO=19
    -D LORA_MOSI=27
    -D LORA_SS=18
    -D LORA_RST=23
    -D LORA_BUSY=32
    -D LORA_DIO1=33
    -D LED_PIN=4
    -D PMU_WIRE_SDA=21
    -D PMU_WIRE_SCL=22
