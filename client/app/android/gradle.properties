# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
org.gradle.parallel=true

org.gradle.caching=false
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Capacitor plugin compatibility
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=36,35

# Strict JDK pinning to JBR 21
org.gradle.java.home=C:/Users/darck/.jdk/jbr21

# Keystore signing — NUNCA versionar en el repositorio
# Este archivo está en .gitignore. Copiar a cada máquina local manualmente.
RED_RELEASE_STORE_FILE=../red-release.keystore
RED_RELEASE_STORE_PASSWORD=red_sovereign_release_2026
RED_RELEASE_KEY_ALIAS=red-release-key
RED_RELEASE_KEY_PASSWORD=red_sovereign_release_2026