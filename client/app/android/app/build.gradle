apply plugin: 'com.android.application'

android {
    namespace = "f.red.app"
    compileSdk 35

    defaultConfig {
        applicationId "f.red.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 116000
        versionName "116.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    aaptOptions {
        // Force AAPT to not ignore the _next Javascript chunks folder!
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        release {
            if (project.hasProperty('RED_RELEASE_STORE_FILE')) {
                // Firma desde variables Gradle (CI/CD o gradle.properties local — NO en el repo)
                storeFile file(RED_RELEASE_STORE_FILE)
                storePassword RED_RELEASE_STORE_PASSWORD
                keyAlias RED_RELEASE_KEY_ALIAS
                keyPassword RED_RELEASE_KEY_PASSWORD
            } else if (file("../red-release.keystore").exists()) {
                // Firma desde keystore local — credenciales DEBEN estar en gradle.properties (excluido del repo)
                // Crear: client/app/android/gradle.properties con:
                //   RED_RELEASE_STORE_FILE=../red-release.keystore
                //   RED_RELEASE_STORE_PASSWORD=<tu_password>
                //   RED_RELEASE_KEY_ALIAS=red-release-key
                //   RED_RELEASE_KEY_PASSWORD=<tu_password>
                storeFile file("../red-release.keystore")
                storePassword project.findProperty('RED_RELEASE_STORE_PASSWORD') ?: System.getenv('RED_RELEASE_STORE_PASSWORD') ?: ''
                keyAlias project.findProperty('RED_RELEASE_KEY_ALIAS') ?: System.getenv('RED_RELEASE_KEY_ALIAS') ?: 'red-release-key'
                keyPassword project.findProperty('RED_RELEASE_KEY_PASSWORD') ?: System.getenv('RED_RELEASE_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (project.hasProperty('RED_RELEASE_STORE_FILE') || file("../red-release.keystore").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}

apply from: 'capacitor.build.gradle'

