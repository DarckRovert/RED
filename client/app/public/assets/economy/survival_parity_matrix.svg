<svg viewBox="0 0 720 330" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1524" />
      <stop offset="100%" stop-color="#060C14" />
    </linearGradient>
  </defs>

  <rect width="720" height="330" rx="12" fill="#070B12" stroke="rgba(0, 230, 118, 0.3)" stroke-width="1" />

  <!-- Header -->
  <rect x="0" y="0" width="720" height="42" fill="#0C1322" />
  <text x="20" y="26" fill="#00E676" font-size="13" font-weight="800" letter-spacing="0.5" font-family="monospace">
    MATRIZ DE PARIDAD DE SUPERVIVENCIA · 10 CRÉDITOS RED = SUMINISTROS TANGIBLES
  </text>

  <!-- Banner Central de Referencia -->
  <g transform="translate(16, 52)">
    <rect width="688" height="46" rx="8" fill="#081E15" stroke="rgba(0,230,118,0.4)" stroke-width="1" />
    <circle cx="30" cy="23" r="14" fill="rgba(0,230,118,0.2)" />
    <text x="30" y="28" fill="#00E676" font-size="14" text-anchor="middle">⚖️</text>
    <text x="56" y="23" fill="#FFF" font-size="12" font-weight="800" font-family="sans-serif">
      Unidad Base: 10 Créditos RED
    </text>
    <text x="56" y="36" fill="#8696A0" font-size="10" font-family="monospace">
      Equivalente Oficial de Consenso: S/ 38.00 PEN · $ 10.00 USD
    </text>
    <rect x="520" y="10" width="154" height="26" rx="6" fill="#00E676" />
    <text x="597" y="27" fill="#04060A" font-size="11" font-weight="900" text-anchor="middle" font-family="monospace">
      RESPALDO FÍSICO
    </text>
  </g>

  <!-- 4 Tarjetas de Recursos Vitales -->
  <!-- Recurso 1: Agua -->
  <g transform="translate(16, 110)">
    <rect width="160" height="198" rx="8" fill="url(#matrixGrad)" stroke="rgba(0,229,255,0.3)" stroke-width="1" />
    <rect x="12" y="12" width="32" height="32" rx="6" fill="rgba(0,229,255,0.15)" />
    <text x="28" y="34" font-size="16" text-anchor="middle">💧</text>
    <text x="52" y="24" fill="#E2E8F0" font-size="11" font-weight="700" font-family="sans-serif">Agua Potable</text>
    <text x="52" y="38" fill="#00E5FF" font-size="13" font-weight="900" font-family="monospace">3.3 L</text>

    <!-- Medidor de Nivel -->
    <rect x="16" y="60" width="128" height="56" rx="6" fill="#031620" />
    <rect x="22" y="74" width="116" height="32" rx="4" fill="#0284C7" />
    <text x="80" y="94" fill="#FFF" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">100% DIARIO</text>

    <text x="14" y="136" fill="#94A3B8" font-size="10" font-family="sans-serif">
      <tspan x="14" dy="0">3.3 litros de agua</tspan>
      <tspan x="14" dy="13">mineralizada o filtrada.</tspan>
      <tspan x="14" dy="13">Cubre el requerimiento</tspan>
      <tspan x="14" dy="13">de 1 adulto por 24 hrs.</tspan>
    </text>
  </g>

  <!-- Recurso 2: Ración MRE -->
  <g transform="translate(192, 110)">
    <rect width="160" height="198" rx="8" fill="url(#matrixGrad)" stroke="rgba(255,160,0,0.3)" stroke-width="1" />
    <rect x="12" y="12" width="32" height="32" rx="6" fill="rgba(255,160,0,0.15)" />
    <text x="28" y="34" font-size="16" text-anchor="middle">🥫</text>
    <text x="52" y="24" fill="#E2E8F0" font-size="11" font-weight="700" font-family="sans-serif">Ración MRE</text>
    <text x="52" y="38" fill="#FFB300" font-size="13" font-weight="900" font-family="monospace">1.0 ud</text>

    <!-- Medidor Calórico -->
    <rect x="16" y="60" width="128" height="56" rx="6" fill="#241402" />
    <rect x="22" y="74" width="116" height="32" rx="4" fill="#D97706" />
    <text x="80" y="94" fill="#FFF" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">2,400 KCAL</text>

    <text x="14" y="136" fill="#94A3B8" font-size="10" font-family="sans-serif">
      <tspan x="14" dy="0">Ración de combate</tspan>
      <tspan x="14" dy="13">auto-calentable lista</tspan>
      <tspan x="14" dy="13">para consumo sin fuego</tspan>
      <tspan x="14" dy="13">ni cocina de campaña.</tspan>
    </text>
  </g>

  <!-- Recurso 3: Medicina -->
  <g transform="translate(368, 110)">
    <rect width="160" height="198" rx="8" fill="url(#matrixGrad)" stroke="rgba(255,23,68,0.3)" stroke-width="1" />
    <rect x="12" y="12" width="32" height="32" rx="6" fill="rgba(255,23,68,0.15)" />
    <text x="28" y="34" font-size="16" text-anchor="middle">💊</text>
    <text x="52" y="24" fill="#E2E8F0" font-size="11" font-weight="700" font-family="sans-serif">Botiquín TCCC</text>
    <text x="52" y="38" fill="#FF5252" font-size="13" font-weight="900" font-family="monospace">0.6 dosis</text>

    <!-- Medidor Médico -->
    <rect x="16" y="60" width="128" height="56" rx="6" fill="#220608" />
    <rect x="22" y="74" width="70" height="32" rx="4" fill="#E11D48" />
    <text x="80" y="94" fill="#FFF" font-size="10" font-weight="800" text-anchor="middle" font-family="monospace">ANTIBIÓTICO</text>

    <text x="14" y="136" fill="#94A3B8" font-size="10" font-family="sans-serif">
      <tspan x="14" dy="0">Dosis de antibiótico</tspan>
      <tspan x="14" dy="13">de amplio espectro o</tspan>
      <tspan x="14" dy="13">gasas hemostáticas</tspan>
      <tspan x="14" dy="13">de trauma táctico.</tspan>
    </text>
  </g>

  <!-- Recurso 4: Energía Solar -->
  <g transform="translate(544, 110)">
    <rect width="160" height="198" rx="8" fill="url(#matrixGrad)" stroke="rgba(0,230,118,0.3)" stroke-width="1" />
    <rect x="12" y="12" width="32" height="32" rx="6" fill="rgba(0,230,118,0.15)" />
    <text x="28" y="34" font-size="16" text-anchor="middle">🔋</text>
    <text x="52" y="24" fill="#E2E8F0" font-size="11" font-weight="700" font-family="sans-serif">Energía Solar</text>
    <text x="52" y="38" fill="#00E676" font-size="13" font-weight="900" font-family="monospace">250 Wh</text>

    <!-- Medidor Eléctrico -->
    <rect x="16" y="60" width="128" height="56" rx="6" fill="#041E11" />
    <rect x="22" y="74" width="116" height="32" rx="4" fill="#059669" />
    <text x="80" y="94" fill="#FFF" font-size="11" font-weight="800" text-anchor="middle" font-family="monospace">10 CARGAS</text>

    <text x="14" y="136" fill="#94A3B8" font-size="10" font-family="sans-serif">
      <tspan x="14" dy="0">Almacenamiento en</tspan>
      <tspan x="14" dy="13">batería LiFePO4.</tspan>
      <tspan x="14" dy="13">Recarga hasta 10</tspan>
      <tspan x="14" dy="13">teléfonos o 5 radios.</tspan>
    </text>
  </g>
</svg>
