name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: client/app
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        working-directory: client/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/app
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: client/app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: client/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp client/app/android/app/build/outputs/apk/debug/app-debug.apk release-assets/red-${{ github.ref_name }}-latest.apk
          cp client/app/android/app/build/outputs/apk/debug/app-debug.apk release-assets/red-latest.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RED ${{ github.ref_name }} — Sovereign Mesh OS"
          body: |
            ## RED Sovereign Mesh OS — Release ${{ github.ref_name }}
            
            ### 🔗 Real Connections Master Edition — v60.0.0
            
            - **Blockchain Local PoS Soberano:** Motor de cadena completo con SHA-256 real, árbol de Merkle, nonce, forja de bloques por ranuras y recompensas de validador. 0% datos simulados.
            - **Vales P2P Criptográficos Off-Grid:** Emisión de vales firmados con SHA-256 y códigos QR 260×260 px para comercio peer-to-peer sin internet. Doble gasto prevenido con lista local de vales redimidos.
            - **Live Canvas Vectorial en Tiempo Real:** Streaming de trazos (<40 bytes/trazo) sobre MeshRouter. Paleta táctica con pluma, marcador, borrador y exportación PNG. Sin polling, sin Base64.
            - **Muro Social & Canales P2P Descentralizados:** Publicaciones y reacciones difundidas sobre MeshRouter con sincronización reactiva en tiempo real entre nodos.
            - **Brújula Táctica Off-Grid & Resección:** Filtro de paso bajo vectorial, acimut solar dinámico y triangulación de waypoints persistentes.
            - **Alerta AMBER con Autoridad Criptográfica:** Firma Ed25519/SHA-256 vinculada al DID soberano del operador.
            - **Suite Criptográfica 4/4 PASS:** Shamir SSS (10/10), ML-KEM-768 post-cuántico, Esteganografía LSB, Módem Acústico SoundMesh FSK.
            - **Despliegue Limpio:** 3 dispositivos actualizados (Moto G22, Tablet TB305XU, Note14 Xiaomi). Note14 actualizado de v56.0.0 a v60.0.0.
            
            ### 📱 Descarga Directa del APK:
            Descarga el archivo `red-${{ github.ref_name }}-latest.apk` o `red-latest.apk` adjunto abajo para instalar directamente en tu dispositivo Android (ARM64).
          files: |
            release-assets/red-${{ github.ref_name }}-latest.apk
            release-assets/red-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
