name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/app/package-lock.json

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: client/app
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: client/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/app
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: client/app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: client/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp client/app/android/app/build/outputs/apk/debug/app-debug.apk release-assets/red-v31.0.0-latest.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RED ${{ github.ref_name }} — Sovereign Mesh OS"
          body: |
            ## RED Sovereign Mesh OS — Release ${{ github.ref_name }}
            
            ### Novedades en esta versión:
            - **16 Protocolos RAG Tácticos Offline:** Soporte vital de combate, triaje START, control de hemorragias/torniquete, RCP con DEA, descontaminación QBRN, colapsos, sismos, incendios y señales ópticas SOS.
            - **Traductor Táctico Determinista en 6 Idiomas:** Español, Inglés, Portugués, Francés, Alemán y Quechua (con guías fonéticas).
            - **Centinela Guardian IA S4:** Moderación semántica con red neuronal `toxic-bert` ONNX WASM y detección de duplicados con pHash diferencial de 64 bits.
            - **Auditoría Zero-Trust y Resiliencia Táctica:** Análisis forense en memoria y blindaje con Android Keystore.
            
            ### Descarga del APK:
            Descarga el archivo `red-v31.0.0-latest.apk` adjunto abajo para instalar directamente en tu dispositivo Android (ARM64).
          files: release-assets/red-v31.0.0-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
