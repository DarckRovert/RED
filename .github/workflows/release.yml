name: Release Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate version consistency
        run: |
          ROOT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
              echo "ERROR: Tag version ($TAG_VERSION) doesn't match Cargo.toml ($ROOT_VERSION)"
              exit 1
            fi
          fi
  
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build release binaries
        run: cargo build --release --bin red-node
      
      - name: Generate checksums
        run: |
          mkdir -p release-assets
          cp target/release/red-node release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-assets/
          retention-days: 90
  
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-assets/
      
      - name: Extract release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | head -n -1)
          echo "release_notes=$NOTES" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
