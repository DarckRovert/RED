name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/app/package-lock.json

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: client/app
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        working-directory: client/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/app
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: client/app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: client/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp client/app/android/app/build/outputs/apk/debug/app-debug.apk release-assets/red-${{ github.ref_name }}-latest.apk
          cp client/app/android/app/build/outputs/apk/debug/app-debug.apk release-assets/red-latest.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RED ${{ github.ref_name }} — Sovereign Mesh OS"
          body: |
            ## RED Sovereign Mesh OS — Release ${{ github.ref_name }}
            
            ### 🌐 Novedades en esta versión (${{ github.ref_name }}):
            - **Interoperabilidad WebRTC P2P DataChannels & STUN NAT Traversal:** Comunicación punto a punto directa entre navegadores web (PC / GitHub Pages) y aplicaciones móviles Android a través de Internet.
            - **Relé Ciego Zero-Knowledge (`mesh-relay`):** Transporte de paquetes cifrados AES-256-GCM para clientes bajo CGNAT simétrico estricto sin acceso a claves ni descifrado de datos en servidores centrales.
            - **Persistencia Autónoma Web:** Almacenamiento local aislado para usuarios web con entrega de paquetes en tiempo real.
            - **Motor de Voz Táctica LowBitrateVocoder (1.6–3.2 kbps):** Remuestreo a 8000 Hz, pre-énfasis vocal y compresión IMA-ADPCM de 4 bits (-97.9% de reducción) para transmisión de voz real sobre LoRa y módem acústico ultrasónico SoundMesh (18.5–20.5 kHz).
            - **Prueba de Trabajo Criptográfica Anti-DDoS (MeshProofOfWork):** Algoritmo Hashcash SHA-256 con dificultad dinámica y tolerancia anti-repetición temporal sin servidores centrales.
            - **Gobernador Cinemático de Batería (KineticDutyGovernor):** Análisis de acelerómetro RMS y estado de batería para extender la autonomía de red hasta 48 horas continuas.
            - **Integridad Merkle & Self-Healing (StateIntegrityEngine):** Verificación de raíz Merkle SHA-256 en almacenamiento local con aislamiento automático de registros dañados en cuarentena.
            - **Criptografía Post-Cuántica (PqcCryptoEngine):** Soporte de retículos ML-KEM-768 (FIPS 203) con intercambio híbrido dual ECDH P-256 / X25519.
            - **Actuadores de Hardware Nativo:** Control de Flash LED por `CameraManager` para pulsos Morse militares SOS e iluminación capilar en triaje START.
            - **Catálogo de 35 Módulos Tácticos Verificados:** 0% datos simulados, 100% funcionalidad real operativa.
            
            ### 📱 Descarga Directa del APK:
            Descarga el archivo `red-${{ github.ref_name }}-latest.apk` o `red-latest.apk` adjunto abajo para instalar directamente en tu dispositivo Android (ARM64).
          files: |
            release-assets/red-${{ github.ref_name }}-latest.apk
            release-assets/red-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
