name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: client/app
        run: npm install --legacy-peer-deps

      - name: Build Next.js Static Export
        working-directory: client/app
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: client/app
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: client/app/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: client/app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy and Package Assets for Release
        run: |
          mkdir -p release-assets
          cp client/app/android/app/build/outputs/apk/release/app-release.apk release-assets/RED-${{ github.ref_name }}.apk
          cp client/app/android/app/build/outputs/apk/release/app-release.apk release-assets/red-${{ github.ref_name }}-latest.apk
          cp client/app/android/app/build/outputs/apk/release/app-release.apk release-assets/red-latest.apk
          cp client/app/android/app/build/outputs/apk/release/app-release.apk release-assets/app-release.apk
          cd release-assets && sha256sum * > SHA256SUMS.txt || true

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RED ${{ github.ref_name }} — Sovereign Mesh OS"
          body: |
            ## 🛡️ RED Sovereign Mesh OS — Release ${{ github.ref_name }}
            
            ### 🚀 Hardened P2P & Unified Protocol Edition — v62.0.0
            
            - **Despacho Garantizado de Handshakes & Solicitudes de Contacto:** Enrutamiento instantáneo de `contact_request` y `contact_response` sobre libp2p TCP nativo (Wi-Fi) y WebRTC con alerta táctica y modal reactivo `IncomingContactRequestModal`.
            - **Unificación Canónica y Cero Chats Duplicados:** Resolución universal de claves canónicas de 64 caracteres en Rust y TypeScript. 1 Par = Exactamente 1 Conversación en la barra lateral sin desincronizaciones de perfil.
            - **Enrutamiento E2E de Señalización WebRTC:** Reenvío en tiempo real de paquetes `webrtc_signal` sobre la malla local, activando timbrado instantáneo (`IncomingCallBanner`) y enlaces DTLS-SRTP para llamadas de voz y videollamadas 1-a-1.
            - **Deduplicación Estricta E2E e Idempotencia:** Identificadores deterministas libres de colisiones (`generateDeterministicMsgId`) y almacenamiento de medios en `IndexedMediaVault` (IndexedDB).
            - **Escuadrones Multi-Par (Signal SenderKey) & Walkie-Talkie PTT:** Grupos federados con llaves simétricas rotativas y radio PTT con compresión acústica de ultra-bajo bitrate.
            
            ### 📱 Descarga Directa de Binarios:
            - **Android APK:** `RED-${{ github.ref_name }}.apk` (o `red-latest.apk`) para dispositivos Android (ARM64).
            - **Sumas de Verificación:** Consulta `SHA256SUMS.txt` para comprobar la integridad criptográfica.
          files: |
            release-assets/RED-${{ github.ref_name }}.apk
            release-assets/red-${{ github.ref_name }}-latest.apk
            release-assets/red-latest.apk
            release-assets/app-release.apk
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
