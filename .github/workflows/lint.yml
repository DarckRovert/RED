name: Lint & Format Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  
  javascript-lint:
    name: JavaScript/TypeScript Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/app/package-lock.json
      
      - name: Install dependencies (client/app)
        run: cd client/app && npm ci
      
      - name: Check formatting (client/app)
        run: cd client/app && npm run lint
      
      - name: Install dependencies (signaling)
        if: hashFiles('signaling/package.json') != ''
        run: cd signaling && npm ci
      
      - name: Check syntax & formatting (signaling)
        if: hashFiles('signaling/package.json') != ''
        run: cd signaling && npm run lint
  
  markdown-lint:
    name: Markdown Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      
      - name: Check markdown files
        run: |
          markdownlint '**/*.md' --ignore node_modules --ignore target || true
